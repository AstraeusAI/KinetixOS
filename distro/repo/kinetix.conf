# KinetixOS's own package repository, appended to /etc/pacman.conf on the live
# ISO and on an installed system.
#
# SigLevel = Never, by choice (2026-09-27): packages are published unsigned by
# CI from every commit on the `stable` branch, so there is no signing key to
# manage. Trust rests on write access to the kinetix-pkgs repository and on
# HTTPS from GitHub Pages. To turn signing back on: publish with
# `distro/publish.sh` (without --unsigned) or distro/setup-ci-signing.sh for
# CI, and set this back to `Required DatabaseOptional`.
[kinetix]
SigLevel = Never
Include = /etc/pacman.d/kinetix-mirrorlist
