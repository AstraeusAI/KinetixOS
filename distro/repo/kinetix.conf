# KinetixOS's own package repository, appended to /etc/pacman.conf on the live
# ISO and on an installed system.
#
# SigLevel = Required (not Optional) is the whole point: every package and the
# repo database must carry a valid signature from the Kinetix key that
# kinetix-keyring installs, so a compromised mirror or a hijacked GitHub Pages
# deployment cannot hand the machine a package. The distro's own pacman.conf
# still ships Arch's upstream `LocalFileSigLevel = Optional`; this is the
# stricter rule for the repo Kinetix controls.
[kinetix]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/kinetix-mirrorlist
