# KinetixOS zram swap — the actual "low RAM usage" mechanism, not a slogan:
# cold pages get compressed into RAM instead of sitting resident or hitting
# a disk swap file, so more real memory stays available to whatever's
# actually running. Sized relative to installed RAM so it behaves sensibly
# from a 4GB machine (2GB zram) up to a 64GB workstation (capped at 8GB —
# no single-app workload needs more compressed swap than that, and an
# unbounded fraction would just eat RAM on very large-memory machines for
# no benefit). Read at boot by zram-generator (systemd generator), which
# creates and enables the zram0 swap device itself — nothing else to wire
# up or enable manually.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
