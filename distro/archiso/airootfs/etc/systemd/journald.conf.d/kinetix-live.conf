# The live root is already an overlay on tmpfs — there is no real disk for
# journald to persist to, and nothing here survives shutdown anyway. Storage
# explicitly volatile (rather than relying on journald's "auto" detection of
# that) plus a hard cap keeps journal growth from becoming an unbounded RAM
# consumer over a long-running live session (heavy logging during a dev/test
# session, a crash-looping unit, etc.) — previously uncapped.
[Journal]
Storage=volatile
RuntimeMaxUse=64M
SystemMaxUse=64M
RateLimitIntervalSec=30s
RateLimitBurst=5000

