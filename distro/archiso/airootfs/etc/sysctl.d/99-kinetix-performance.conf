# KinetixOS memory/IO tuning — applies to every CPU/GPU vendor; nothing
# here is hardware-specific (NVIDIA/gaming-specific choices live in their
# own sections below, each with its tradeoff noted).

# ── Memory management: pair with zram (etc/systemd/zram-generator.conf) ──
# so "swapping" a cold page costs a fast in-RAM compression pass, not a
# disk round-trip. That changes the right swappiness value: the classic
# "keep swappiness low so we never swap" advice is tuned for slow disk
# swap, where swapping is a last resort. Against zram, proactively moving
# cold anonymous pages there sooner keeps more real RAM free for active
# work — the actual mechanism behind "less RAM bloat", not a workaround
# for it. 100 is the same value CachyOS/Fedora ship for zram-backed swap.
vm.swappiness = 100

# Keep dentry/inode caches resident longer than the default (100) — desktop
# workloads (a shell, an IDE, a browser, a game's asset directory) repeat
# the same path lookups constantly; dropping that cache under light memory
# pressure just to reclaim a few MB trades a cache miss for a reload.
vm.vfs_cache_pressure = 50

# Fixed-byte dirty-writeback thresholds instead of the default *_ratio
# (percentage-of-RAM) settings. Percentage-based thresholds scale badly
# once "all hardware" includes machines with 32/64/128GB of RAM: a 20%
# dirty_ratio there is many gigabytes of unwritten pages before writeback
# is forced, which then stalls everything for seconds when it finally
# flushes. Fixed bytes give consistent, small stalls instead of rare, huge
# ones — same total data written, far better worst-case latency.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

# Paces kernel flusher wakeup interval to 15 seconds (1500 centisecs, up from 5s)
# so dirty disk writebacks coalesce into sustained streaming writes rather than
# thrashing disks with constant micro-bursts during desktop multitasking.
vm.dirty_writeback_centisecs = 1500

# Disable swap readahead against zram. Because zram is an in-RAM compressed
# block device, speculative multi-page readahead (kernel default: page-cluster = 3,
# reading 8 pages / 32KB) causes pure CPU and memory decompression overhead for cold pages.
# Setting page-cluster = 0 reads only the single requested faulted page.
vm.page-cluster = 0

# Prevent aggressive kswapd watermark boosting under memory fragmentation bursts.
# Modern Linux kernels (5.9+) boost watermarks aggressively when allocations fragment,
# causing premature page cache eviction and severe I/O thrashing even when abundant
# free RAM remains available.
vm.watermark_boost_factor = 0

# Scale factor for kswapd reclaim threshold: starts background reclaim smoothly at
# 1.25% memory watermark, preventing direct reclaim latency spikes in foreground apps.
vm.watermark_scale_factor = 125

# Proactively compact memory in the background (default: 20 -> 50) to prevent synchronous
# allocation stalls and frame drops when huge pages or contiguous buffers are requested.
vm.compaction_proactiveness = 50

# Bumps the per-process memory-map count ceiling well past the kernel
# default (65530). Several game engines and Proton/Wine legitimately need
# more mapped regions than that default allows and fail to start or crash
# under memory pressure without this — Valve's own Steam Linux Runtime
# sets the same value. Harmless for anything that doesn't need it.
vm.max_map_count = 2147483642

# Headroom against fd exhaustion under heavy multitasking (many game
# clients + shader compilation + a browser + an IDE, simultaneously).
fs.file-max = 2097152

# Generous inotify limits for desktop shells (Quickshell), file indexers, code editors,
# and telemetry daemons to avoid inotify queue overflow, broken live reload, or fallen-back
# expensive recursive directory polling.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# Disables periodic NMI watchdog hardware timer interrupts across all CPU cores to eliminate
# inter-core lock contention, reduce power draw, and accelerate boot/shutdown.
kernel.nmi_watchdog = 0

# Increase network device receive queue backlog to avoid packet drops during network bursts.
net.core.netdev_max_backlog = 4096

# ── Gaming-specific, with a disclosed tradeoff ──────────────────────────
# Intel's split-lock-detect mitigation (a security hardening feature) has
# caused severe, reproducible stuttering in specific games and emulators
# that hit split-lock traps — documented by several gaming-focused distros
# (Nobara, Bazzite, CachyOS). Disabling it trades a narrow security
# mitigation for eliminating that stutter class; it is a no-op on AMD and
# a harmless unknown-key warning on kernels/CPUs without the knob at all,
# so it is safe to ship unconditionally rather than gate behind detected
# hardware.
kernel.split_lock_mitigate = 0

