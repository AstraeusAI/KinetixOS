# KinetixOS Transparent Hugepage Tuning
# Defer memory compaction and defragmentation asynchronously to background kcompactd/kswapd
# instead of blocking foreground threads synchronously, eliminating compositor frame drops
# and application allocation latency spikes.
w! /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise

# THP Shrinker: split hugepages that are >80% zero-filled (409/512 pages) to prevent
# memory bloat and unnecessary swap/zram pressure.
w! /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409
