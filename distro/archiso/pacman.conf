[options]
Architecture = auto
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Baseline x86_64 CachyOS repository only. Do not enable cachyos-v3/v4:
# KinetixOS targets CPUs below those microarchitecture levels too.
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# KinetixOS's own signed repository: the desktop shell, agent runtime and
# `kinetix` command, so they can be updated by `kinetix update` rather than
# only replaced by a fresh ISO. Same stanza as distro/repo/kinetix.conf, kept
# in sync by a test. SigLevel = Required (stricter than the upstream
# LocalFileSigLevel = Optional above) is deliberate: Kinetix controls this
# repo, so it can and should demand signatures on it.
[kinetix]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/kinetix-mirrorlist
