[options]
Architecture = auto
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Baseline x86_64 CachyOS repository only. Do not enable cachyos-v3/v4:
# KinetixOS targets CPUs below those microarchitecture levels too.
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# KinetixOS's own repository: the desktop shell, agent runtime and `kinetix`
# command, so they can be updated by `kinetix update` rather than only
# replaced by a fresh ISO. Same stanza as distro/repo/kinetix.conf, kept in
# sync by a test. Published unsigned by CI (SigLevel = Never) — see that file
# for the trust model and how to turn signing back on.
[kinetix]
SigLevel = Never
Include = /etc/pacman.d/kinetix-mirrorlist
