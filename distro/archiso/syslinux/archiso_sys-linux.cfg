LABEL arch
TEXT HELP
Boot the KinetixOS live medium with the CachyOS BORE kernel.
The Arch kernel remains available as a fallback.
ENDTEXT
MENU LABEL KinetixOS live (BORE, %ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-bore
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-bore.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

LABEL arch-fallback
TEXT HELP
Boot KinetixOS live with the standard Arch kernel as a compatibility fallback.
ENDTEXT
MENU LABEL KinetixOS live (Arch kernel fallback, %ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Accessibility entry uses the BORE kernel, with fallback available above.
LABEL archspeech
TEXT HELP
Boot KinetixOS live with speech accessibility enabled.
ENDTEXT
MENU LABEL KinetixOS live (BORE, %ARCH%, BIOS) with speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-bore
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-bore.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on

# Opt-in NVIDIA path: never DEFAULT, selected explicitly at the boot menu
# by whoever knows they have a Turing-or-newer NVIDIA GPU. See packages.x86_64
# for why the kernel is installed unconditionally but not auto-selected.
LABEL arch-nvidia
TEXT HELP
Boot KinetixOS live with the NVIDIA-open BORE kernel variant (Turing or newer GPUs).
ENDTEXT
MENU LABEL KinetixOS live (BORE, %ARCH%, BIOS) with NVIDIA open driver
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-bore-nvidia-open
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-bore-nvidia-open.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
