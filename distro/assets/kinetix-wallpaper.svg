<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070e"/>
      <stop offset="0.34" stop-color="#11121e"/>
      <stop offset="0.62" stop-color="#27121d"/>
      <stop offset="0.80" stop-color="#4a121d"/>
      <stop offset="1" stop-color="#0a0b12"/>
    </linearGradient>
    <radialGradient id="eclipseGlow">
      <stop offset="0" stop-color="#ff2446" stop-opacity="0.46"/>
      <stop offset="0.30" stop-color="#ed173a" stop-opacity="0.28"/>
      <stop offset="0.66" stop-color="#a10e2c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#a10e2c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizonGlow">
      <stop offset="0" stop-color="#fc2144" stop-opacity="0.65"/>
      <stop offset="0.44" stop-color="#c81835" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c81835" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farRidge" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#232333"/>
      <stop offset="0.48" stop-color="#171925"/>
      <stop offset="1" stop-color="#10131d"/>
    </linearGradient>
    <linearGradient id="midRidge" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#171a26"/>
      <stop offset="0.52" stop-color="#11141e"/>
      <stop offset="1" stop-color="#090c14"/>
    </linearGradient>
    <linearGradient id="cliffLeft" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#11131c"/>
      <stop offset="0.48" stop-color="#080b12"/>
      <stop offset="1" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="cliffRight" x1="1" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#17121d"/>
      <stop offset="0.55" stop-color="#0a0c14"/>
      <stop offset="1" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21101a"/>
      <stop offset="0.25" stop-color="#130d16"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="lightLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fa2041" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fa2041" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ff3854" stop-opacity="0.95"/>
      <stop offset="0.66" stop-color="#fa2041" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#fa2041" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1722"/>
      <stop offset="1" stop-color="#080a11"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="wideGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>

