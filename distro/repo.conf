# Where KinetixOS publishes its own packages. Single source of truth: both
# the mirrorlist (baked into the ISO and shipped by the keyring) and
# publish.sh (which pushes the built repo here) are derived from it, and a
# test asserts the mirrorlist URL matches this owner/name.

# The GitHub account (or org) that owns the package repository.
KINETIX_REPO_OWNER="AstraeusAI"

# The repository that serves the signed pacman repo over GitHub Pages.
# Deliberately separate from the KinetixOS source repo: built artifacts and
# source history have different lifetimes and should not share a git tree.
KINETIX_REPO_NAME="kinetix-pkgs"

# The branch GitHub Pages serves from.
KINETIX_REPO_BRANCH="main"

# The pacman repository name as it appears in pacman.conf (`[kinetix]`).
KINETIX_PACMAN_REPO="kinetix"
