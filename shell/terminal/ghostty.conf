# KinetixOS quick terminal — Ghostty configuration
# ─────────────────────────────────────────────────
# This is NOT the user's personal Ghostty config. toggle.sh launches Ghostty
# with `--config-default-files=false --config-file=<this file>`, so this is
# the *only* config that instance ever sees, entirely independent of the
# system default at /etc/xdg/ghostty/config and whatever the user has (or
# doesn't have) at ~/.config/ghostty/config.
#
# Why real Ghostty, not a QML reimplementation: QML can't embed a foreign
# Wayland surface, and puppeting a real window's geometry frame-by-frame
# through KWin scripting (D-Bus + journal round trips, see runtime/lib/
# kwin.py) is nowhere near fast enough for a smooth slide animation.
# Ghostty's quick terminal is a first-class feature on Linux/GTK that
# renders as its own wlr-layer-shell surface and, on KWin specifically,
# animates via the native org_kde_kwin_slide protocol — a real compositor-
# driven slide, not something this shell could match by hand. This config
# file is how the shell still owns the *look* of that surface: colors, font,
# blur, sizing all come from here and are kept in step with shell/common/
# Theme.qml's crimson family (docs/02-design-system.md) by hand — Ghostty
# has no notion of that file, so if Theme.qml's palette changes, this file
# needs the matching edit.
#
# An alternative — a real terminal embedded directly in the QML scene graph
# via the qmltermwidget plugin — was tried and works, but renders with a
# different (Konsole/qtermwidget) engine, not Ghostty itself. Given the
# choice, this shell keeps real Ghostty and controls it externally instead.
#
# See docs/02-design-system.md, "Main bar palette" / "Agent Panel palette".

# ── identity ─────────────────────────────────────────────────────────────
# Distinct GTK single-instance so a stray `ghostty` launched some other way
# never gets mistaken for (or fights over) this one.
class = com.kinetixos.quick-terminal
gtk-quick-terminal-namespace = kinetix-quick-terminal

# ── quick terminal geometry & behavior ──────────────────────────────────
quick-terminal-position = top
quick-terminal-size = 46%
quick-terminal-screen = main
# Overlay = in front of everything, same stacking as this shell's other
# popups (AgentPanel/AppCenterPopup/SysPopup all use WlrLayer.Overlay).
gtk-quick-terminal-layer = overlay
# Stays open across focus loss — this is meant for real work (paste output
# elsewhere, tab back in), not a glance-and-dismiss HUD. This already
# matches Ghostty's own Linux default; set explicitly so it's a decision on
# record, not an accident of platform defaults. It also means toggle.sh is
# the *only* thing that ever hides this surface — see that script's own
# comment for why that makes its little state file an accurate mirror of
# what's actually on screen.
quick-terminal-autohide = false
quick-terminal-keyboard-interactivity = on-demand
# Ignored on Linux today (see Ghostty's own doc comment on this key — the
# GTK/KDE-slide-protocol path has no duration knob yet, ~400ms is fixed in
# Ghostty's winproto code) but set for when/if that lands, and as a record
# of intent.
quick-terminal-animation-duration = 0.22

# No titlebar, no border — the terminal surface itself IS the dropdown,
# edge to edge, not a terminal sitting inside a separate frame.
window-decoration = false
window-padding-x = 16
window-padding-y = 14
window-padding-balance = true

# ── glass ────────────────────────────────────────────────────────────────
# Same frosted-glass language as every QML panel in this shell
# (components/GlassPanel.qml: translucent base + blur). ext-background-
# effect-v1 blur depends on compositor support; falls back to plain
# translucency if the running KWin doesn't implement it — never a crash,
# just less glassy.
background-opacity = 0.90
background-blur = true

# ── palette ──────────────────────────────────────────────────────────────
# background/foreground/cursor/selection match Theme.qml's crimson family
# directly. Only the red slots (1, 9) are nudged to the theme's exact reds;
# every other ANSI color (green/yellow/blue/magenta/cyan + their bright
# variants) is left at Ghostty's own default. Terminal output uses those
# colors for real meaning (pass/fail, diff +/-, log levels) — recoloring
# them into the crimson family would look "on brand" and read worse, the
# same tradeoff this shell already made for the OS-level status colors
# (docs/02: "those colors carry meaning ... never swept into a single hue
# family").
background = 0f0709
foreground = f0e6e7
cursor-color = ff2e43
cursor-style = block
cursor-style-blink = true
selection-background = e01a3c
selection-foreground = 0f0709
palette = 0=#1a0a0d
palette = 8=#4a2229
palette = 1=#ff2e43
palette = 9=#ff4d6d

# ── type ─────────────────────────────────────────────────────────────────
# Same monospace family as the rest of the shell (Theme.fontMono) — the
# wordmark, bar readouts, and cockpit values all already use it.
font-family = JetBrains Mono
font-size = 12
adjust-cell-height = 5%

# ── shell integration ────────────────────────────────────────────────────
# Working-directory inheritance, prompt marking, resize repaint quality —
# all real quality-of-life for a terminal meant for actual work.
shell-integration = detect
shell-integration-features = true

# The quick terminal has no titlebar to show a subtitle in, but keep this
# sane in case this config is ever reused for a normal window.
window-subtitle = working-directory
confirm-close-surface = false
